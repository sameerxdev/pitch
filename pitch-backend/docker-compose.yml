services:
  mongo:
    image: mongo:7
    container_name: pitch-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: pitch-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=pitch
      - UPLOAD_DIR=/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/data/uploads
      - ./app:/app/app

volumes:
  mongo_data:
  uploads_data:
